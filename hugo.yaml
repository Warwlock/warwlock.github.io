baseURL: "https://www.warwlock.com/"
title: Warwlock Portfolio
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 6
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false
  
params:
  author: Warwlock
  authorimage: images/featured/esp01-featured.jpg
  og_image: images/featured/esp01-featured.jpg
  description: "Game Development and Tool Creation"
  title: Warwlock Portfolio
  moto: "Home Assistant with ESPHome"
  text: "A deep dive into creating a custom smart home, from designing my own ESP-01 circuits on perfboard to programming them with ESPHome for seamless Home Assistant control."
  disable_theme_toggle: false
  disable_stay_uptodate: true
  disable_blog: true
  disable_sponsor: true

  p1:
    heading: "Game Development Projects"
    image: "images/pages/cog-cipher/cog-cipher-ingame1.png"
    content:
      - text: Game jams have been a crucial part of my development process, providing intense environments to rapidly prototype and bring ideas to life. On itch.io, I've created some games for game jams under the pressure of time constraints. Alongside these, you can also find examples of my mobile game development, showcasing a broader scope of my work.
      - text: "My latest game is Cog & Cipher: Mystrey of Uncle Oliver. I made this for Epic Mega Jam inside Unreal Engine. Find more at: "
        link: "https://warwlock.itch.io/cog-ciphers-mystery-of-uncle-oliver"
        linktext: "Cog & Cipher at itch.io"
      - text: "You can find all of my games and my game development journey at:"
    link:
      url: "/game-development/"
      text: "Game Development"
      
  p2:
    heading: "Tool & Utility Development"
    image: "images/featured/msn-graph-img.png"
    content:
      - text: My interest in tackling technical challenges extends to creating custom tools and solutions. I've developed some utilities beside game development. 
      - text: Such as a tool for bridging the gap between Blender materials and Unity shaders, a replacement for Unity's standard post-processing with advanced features, and a system for bringing Blender's node-based workflow into Unity's Shader Graph. These projects demonstrate my ability to identify pain points in development workflows and engineer innovative solutions.
    link:
      url: "https://github.com/Warwlock"
      text: Find more at my Github Page
  
  pe1:
    heading: "Other Projects"
    image: "images/featured/3d-video-render.png"
    content:
      - text: Alongside my game development projects and tool development projects, I also worked on other stuff such  as 3D modeling and 3D animations. I also tried to create a music for a remix contest.
      - text: "I published all of my 3D work and game development projects on Youtube:"
    link:
      url: "https://www.youtube.com/@Warwlock"
      text: "Check Out My Youtube Channel"

  p3:
    heading: "Backed by world-renowned investors"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque. Blandit amet, sed aenean erat arcu morbi. Cursus faucibus nunc nisl netus morbi vel porttitor vitae ut. Amet vitae fames senectus vitae."
    links:
      - text: Meet our investors and advisors
        url: "#"
    logos:
      - identifier: a
        image: "images/global/sample-logo.svg"
        alt: "a"
      - identifier: b
        image: "images/global/author.webp"
        alt: "Hello World"
      - identifier: c
      - identifier: d
      - identifier: e
      - identifier: f
  p4:
    heading: "From the blog"
    content:
      - text: "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsa libero labore natus atque, ducimus sed."
  p5:
    heading: "Stay Up to Date"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque."
    action: "#"
    label: "Email address"
    placeholder: "Enter your email"
    button: "Notify me"

  social_media:
    github:
      enabled: true
      url: 'https://github.com/Warwlock'
    patreon:
      enabled: false
      url: 'https://github.com/Warwlock'
    facebook:
      enabled: false
      url: 'https://facebook.com/nusserstudios'
    instagram:
      enabled: true
      url: 'https://www.instagram.com/warwlock/'
    twitter:
      enabled: true
      url: 'https://x.com/warwlock'
    youtube:
      enabled: true
      url: 'https://www.youtube.com/@Warwlock'
    

